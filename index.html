<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PILLAR Performance — Supplement Advisor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black: #0a0a0a;
    --white: #f5f3ef;
    --off-white: #ede9e3;
    --mid: #b8b0a4;
    --accent: #ffffff;
    --accent-dark: #cccccc;
    --text-muted: #7a7469;
    --card-bg: #141412;
    --border: #2a2825;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    font-family: 'Barlow', sans-serif;
    background: var(--black);
    color: var(--white);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BACKGROUND TEXTURE */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(200,240,74,0.06) 0%, transparent 60%),
      url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.015'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 760px;
    margin: 0 auto;
    padding: 0 24px 60px;
  }

  /* HEADER */
  .header {
    padding: 40px 0 48px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    border-bottom: 1px solid var(--border);
    margin-bottom: 48px;
    animation: fadeDown 0.6s ease both;
  }

  .logo-lockup {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    background: var(--white);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .logo-text {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .logo-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 26px;
    letter-spacing: 0.08em;
    color: var(--white);
    line-height: 1;
  }

  .logo-sub {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 0.22em;
    color: var(--mid);
    font-weight: 400;
    line-height: 1;
    margin-top: 3px;
  }

  .header-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(38px, 7vw, 64px);
    font-weight: 800;
    letter-spacing: 0.02em;
    line-height: 0.95;
    text-transform: uppercase;
    color: var(--white);
  }

  .header-title em {
    color: var(--accent);
    font-style: normal;
  }

  .header-desc {
    margin-top: 16px;
    font-size: 15px;
    color: var(--mid);
    font-weight: 300;
    line-height: 1.6;
    max-width: 460px;
  }

  /* PROGRESS */
  .progress-wrap {
    margin-bottom: 36px;
    animation: fadeIn 0.4s ease both;
  }

  .progress-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .progress-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
  }

  .progress-count {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--mid);
    font-weight: 600;
  }

  .progress-track {
    height: 2px;
    background: var(--border);
    position: relative;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  }

  /* QUESTION CARD */
  .question-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 36px 40px;
    margin-bottom: 16px;
    animation: slideUp 0.4s cubic-bezier(0.4,0,0.2,1) both;
  }

  .question-tag {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--accent);
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .question-text {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(22px, 4vw, 30px);
    font-weight: 700;
    color: var(--white);
    line-height: 1.15;
    letter-spacing: 0.01em;
    margin-bottom: 28px;
    text-transform: uppercase;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    background: transparent;
    border: 1px solid var(--border);
    padding: 16px 20px;
    text-align: left;
    cursor: pointer;
    font-family: 'Barlow', sans-serif;
    font-size: 15px;
    font-weight: 400;
    color: var(--mid);
    transition: all 0.18s ease;
    display: flex;
    align-items: center;
    gap: 14px;
    position: relative;
    overflow: hidden;
  }

  .option-btn::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0;
    background: var(--accent);
    transition: width 0.18s ease;
  }

  .option-btn:hover {
    border-color: var(--accent);
    color: var(--white);
    background: rgba(200,240,74,0.04);
  }

  .option-btn:hover::before {
    width: 3px;
  }

  .option-btn:active {
    transform: scale(0.99);
  }

  .option-letter {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    min-width: 20px;
    transition: color 0.18s;
  }

  .option-btn:hover .option-letter {
    color: var(--accent);
  }

  /* NAV */
  .nav-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 20px;
    animation: fadeIn 0.4s ease 0.1s both;
  }

  .back-btn {
    background: transparent;
    border: 1px solid var(--border);
    padding: 10px 18px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 13px;
    letter-spacing: 0.12em;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.18s;
  }

  .back-btn:hover {
    border-color: var(--mid);
    color: var(--white);
  }

  /* RESULTS */
  .results-wrap {
    animation: slideUp 0.5s cubic-bezier(0.4,0,0.2,1) both;
  }

  .results-hero {
    background: var(--accent);
    padding: 32px 40px;
    margin-bottom: 4px;
  }

  .results-hero-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--black);
    font-weight: 700;
    text-transform: uppercase;
    opacity: 0.6;
    margin-bottom: 8px;
  }

  .results-hero-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: clamp(28px, 5vw, 44px);
    font-weight: 800;
    color: var(--black);
    text-transform: uppercase;
    letter-spacing: 0.02em;
    line-height: 1;
    margin-bottom: 12px;
  }

  .results-hero-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .meta-tag {
    font-family: 'Barlow', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: var(--black);
    background: rgba(0,0,0,0.12);
    padding: 4px 10px;
    letter-spacing: 0.02em;
  }

  .results-count-bar {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-top: none;
    padding: 14px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 32px;
  }

  .results-count-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
  }

  .results-count-num {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  /* SUPPLEMENT CARDS */
  .supp-section-label {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 0.2em;
    color: var(--text-muted);
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 12px;
    padding-left: 2px;
  }

  .supp-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    margin-bottom: 10px;
    display: grid;
    grid-template-columns: 4px 1fr;
    overflow: hidden;
    animation: slideUp 0.4s ease both;
  }

  .supp-stripe { height: 100%; }
  .stripe-core { background: var(--accent); }
  .stripe-injury { background: #f04a6a; }
  .stripe-performance { background: #4ac4f0; }
  .stripe-immune { background: #c04af0; }
  .stripe-recovery { background: #f09a4a; }

  .supp-content { padding: 20px 24px; }

  .supp-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }

  .supp-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 19px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 1.1;
  }

  .supp-badge {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    padding: 3px 9px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .badge-core { background: rgba(255,255,255,0.1); color: var(--accent); }
  .badge-injury { background: rgba(240,74,106,0.12); color: #f04a6a; }
  .badge-performance { background: rgba(74,196,240,0.12); color: #4ac4f0; }
  .badge-immune { background: rgba(192,74,240,0.12); color: #c04af0; }
  .badge-recovery { background: rgba(240,154,74,0.12); color: #f09a4a; }

  .supp-body {
    font-size: 14px;
    color: var(--mid);
    line-height: 1.65;
    font-weight: 300;
  }

  .supp-body strong {
    color: var(--white);
    font-weight: 500;
  }

  .supp-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 14px;
  }

  .timing-pill {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 0.1em;
    font-weight: 600;
    color: var(--text-muted);
    border: 1px solid var(--border);
    padding: 3px 10px;
    text-transform: uppercase;
  }

  /* DISCLAIMER */
  .disclaimer {
    margin-top: 32px;
    padding: 20px 24px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.6;
    font-weight: 300;
  }

  /* RESTART */
  .restart-row {
    margin-top: 28px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }

  .restart-btn {
    background: var(--white);
    border: none;
    padding: 14px 28px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    letter-spacing: 0.15em;
    font-weight: 700;
    color: var(--black);
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.18s;
  }

  .restart-btn:hover {
    background: var(--accent);
  }

  .secondary-btn {
    background: transparent;
    border: 1px solid var(--border);
    padding: 14px 28px;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 14px;
    letter-spacing: 0.15em;
    font-weight: 700;
    color: var(--mid);
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.18s;
  }

  .secondary-btn:hover {
    border-color: var(--mid);
    color: var(--white);
  }

  /* KEYFRAMES */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* LOADING / TRANSITION */
  .fade-out { animation: fadeOut 0.2s ease forwards; }
  @keyframes fadeOut {
    to { opacity: 0; transform: translateY(-8px); }
  }

  /* FOOTER */
  .footer {
    margin-top: 60px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: gap;
  }

  .footer-brand {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 12px;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
  }

  .footer-link {
    font-size: 12px;
    color: var(--text-muted);
    text-decoration: none;
    font-weight: 300;
    transition: color 0.15s;
  }

  .footer-link:hover { color: var(--accent); }

  @media (max-width: 520px) {
    .question-card { padding: 24px 20px; }
    .results-hero { padding: 24px 20px; }
    .results-count-bar { padding: 12px 20px; }
  }
</style>
</head>

function getRecommendations(a) {
  const recs = [];

  if (a.load !== 'low') recs.push('bvitamin');
  return [...new Set(recs)];

        <span class="progress-count">Protocol Ready</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:100%"></div></div>
    </div>`;

  const metaTags = [
    GOAL_LABELS[answers.goal] || '',
    SPORT_LABELS[answers.sport] || '',
    LOAD_LABELS[answers.load] || ''
  ].filter(Boolean).map(t => `<span class="meta-tag">${t}</span>`).join('');

  const suppCards = recs.map((key, idx) => {
    const s = SUPPS[key];
    return `
      <div class="supp-card" style="animation-delay:${idx * 0.06}s">
        <div class="supp-stripe ${s.stripe}"></div>
        <div class="supp-content">
          <div class="supp-top">
            <div class="supp-name">${s.name}</div>
            <div class="supp-badge ${s.badge}">${s.badgeLabel}</div>
          </div>
          <div class="supp-body">${s.body}</div>
          <div class="supp-pills">${s.timing.map(t => `<span class="timing-pill">${t}</span>`).join('')}</div>
        </div>
      </div>`;
  }).join('');

  app.innerHTML = progress + `
    <div class="results-wrap">
      <div class="results-hero">
        <div class="results-hero-label">Your personalised protocol</div>
        <div class="results-hero-title">Supplement<br>Protocol</div>
        <div class="results-hero-meta">${metaTags}</div>
      </div>
      <div class="results-count-bar">
        <span class="results-count-label">Supplements recommended</span>
        <span class="results-count-num">${recs.length}</span>
      </div>
      ${suppCards}
      <div class="disclaimer">
        This protocol is a starting-point guide based on your answers. Dosages above represent performance-level recommendations. Always consult a qualified health professional before starting any supplement regimen. Pillar Performance products are third-party tested and informed sport certified.
      </div>
      <div class="restart-row">
        <button class="restart-btn" onclick="restart()">Start over</button>
        <button class="secondary-btn" onclick="window.open('https://pillarperformance.shop','_blank')">Shop Pillar →</button>
      </div>
    </div>`;
}

function selectOption(id, value) {
  history.push({ step, answers: JSON.parse(JSON.stringify(answers)) });
  answers[id] = value;
  step++;
  const app = document.getElementById('app');
  app.classList.add('fade-out');
  setTimeout(() => {
    app.classList.remove('fade-out');
    renderApp();
  }, 180);
}

function goBack() {
  if (!history.length) return;
  const prev = history.pop();
  step = prev.step;
  answers = prev.answers;
  const app = document.getElementById('app');
  app.classList.add('fade-out');
  setTimeout(() => {
    app.classList.remove('fade-out');
    renderApp();
  }, 180);
}

function restart() {
  answers = {}; step = 0; history = [];
  const app = document.getElementById('app');
  app.classList.add('fade-out');
  setTimeout(() => {
    app.classList.remove('fade-out');
    renderApp();
  }, 180);
}

renderApp();
</script>
</body>
</html>
