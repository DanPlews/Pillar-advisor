<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PILLAR Performance — Supplement Advisor</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--black:#0a0a0a;--white:#f5f3ef;--mid:#b8b0a4;--text-muted:#7a7469;--card-bg:#141412;--border:#2a2825;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:'Barlow',sans-serif;background:var(--black);color:var(--white);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(255,255,255,0.04) 0%,transparent 60%);pointer-events:none;z-index:0;}
.container{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 24px 60px;}
.header{padding:40px 0 48px;border-bottom:1px solid var(--border);margin-bottom:48px;animation:fadeDown 0.6s ease both;}
.logo-lockup{margin-bottom:24px;}
.logo-lockup img{height:52px;filter:invert(1);}
.header-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(38px,7vw,64px);font-weight:800;letter-spacing:0.02em;line-height:0.95;text-transform:uppercase;}
.header-desc{margin-top:16px;font-size:15px;color:var(--mid);font-weight:300;line-height:1.6;max-width:460px;}
.progress-wrap{margin-bottom:36px;}
.progress-meta{display:flex;justify-content:space-between;margin-bottom:10px;}
.progress-label{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:0.15em;color:var(--text-muted);font-weight:600;text-transform:uppercase;}
.progress-count{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--mid);font-weight:600;}
.progress-track{height:2px;background:var(--border);overflow:hidden;}
.progress-fill{height:100%;background:#fff;transition:width 0.5s cubic-bezier(0.4,0,0.2,1);}
.question-card{background:var(--card-bg);border:1px solid var(--border);padding:36px 40px;margin-bottom:16px;animation:slideUp 0.4s ease both;}
.question-tag{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:0.2em;color:#fff;font-weight:700;text-transform:uppercase;margin-bottom:14px;}
.question-text{font-family:'Barlow Condensed',sans-serif;font-size:clamp(20px,4vw,28px);font-weight:700;color:#fff;line-height:1.15;margin-bottom:8px;text-transform:uppercase;}
.question-sub{font-size:13px;color:var(--text-muted);margin-bottom:24px;font-weight:300;}
.options{display:flex;flex-direction:column;gap:10px;}
.option-btn{background:transparent;border:1px solid var(--border);padding:16px 20px;text-align:left;cursor:pointer;font-family:'Barlow',sans-serif;font-size:15px;color:var(--mid);transition:all 0.18s;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;width:100%;}
.option-btn::before{content:'';position:absolute;left:0;top:0;bottom:0;width:0;background:#fff;transition:width 0.18s;}
.option-btn:hover{border-color:#fff;color:#fff;background:rgba(255,255,255,0.04);}
.option-btn:hover::before{width:3px;}
.option-btn.selected{border-color:#fff;color:#fff;background:rgba(255,255,255,0.06);}
.option-btn.selected::before{width:3px;}
.option-letter{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:0.1em;color:var(--text-muted);min-width:20px;transition:color 0.18s;flex-shrink:0;}
.option-btn:hover .option-letter,.option-btn.selected .option-letter{color:#fff;}
.multi-hint{font-size:12px;color:var(--text-muted);margin-bottom:16px;font-style:italic;}
.next-btn{margin-top:16px;background:#fff;border:none;padding:13px 28px;font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:0.15em;font-weight:700;color:#0a0a0a;cursor:pointer;text-transform:uppercase;transition:all 0.18s;width:100%;}
.next-btn:hover{background:#ddd;}
.next-btn:disabled{opacity:0.3;cursor:not-allowed;}
.age-wrap{margin-bottom:24px;}
.age-display{font-family:'Barlow Condensed',sans-serif;font-size:64px;font-weight:800;color:#fff;line-height:1;margin-bottom:4px;}
.age-display span{font-size:24px;color:var(--mid);margin-left:4px;}
.age-note{font-size:13px;color:var(--text-muted);margin-bottom:20px;min-height:20px;}
.age-note.highlight{color:#f09a4a;}
input[type=range]{width:100%;-webkit-appearance:none;height:3px;background:var(--border);outline:none;border-radius:2px;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;background:#fff;border-radius:50%;cursor:pointer;transition:transform 0.15s;}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.15);}
.nav-row{margin-top:20px;}
.back-btn{background:transparent;border:1px solid var(--border);padding:10px 18px;font-family:'Barlow Condensed',sans-serif;font-size:13px;letter-spacing:0.12em;font-weight:600;color:var(--text-muted);cursor:pointer;text-transform:uppercase;transition:all 0.18s;}
.back-btn:hover{border-color:var(--mid);color:#fff;}
.results-hero{background:#fff;padding:32px 40px;margin-bottom:4px;}
.results-hero-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:0.2em;color:#333;font-weight:700;text-transform:uppercase;margin-bottom:8px;}
.results-hero-title{font-family:'Barlow Condensed',sans-serif;font-size:clamp(28px,5vw,44px);font-weight:800;color:#0a0a0a;text-transform:uppercase;line-height:1;margin-bottom:12px;}
.results-hero-meta{display:flex;flex-wrap:wrap;gap:8px;}
.meta-tag{font-family:'Barlow',sans-serif;font-size:12px;font-weight:500;color:#0a0a0a;background:rgba(0,0,0,0.1);padding:4px 10px;}
.results-count-bar{background:var(--card-bg);border:1px solid var(--border);border-top:none;padding:14px 40px;display:flex;align-items:center;justify-content:space-between;margin-bottom:32px;}
.results-count-label{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:0.15em;color:var(--text-muted);font-weight:600;text-transform:uppercase;}
.results-count-num{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;color:#fff;}
.section-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:0.2em;color:var(--text-muted);font-weight:700;text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:10px;}
.section-label::after{content:'';flex:1;height:1px;background:var(--border);}
.section-label.is-priority{color:#fff;}
.priority-stack{margin-bottom:36px;}
.supp-card{background:var(--card-bg);border:1px solid var(--border);margin-bottom:10px;display:grid;grid-template-columns:4px 1fr;overflow:hidden;animation:slideUp 0.4s ease both;}
.supp-card.is-priority{border-color:#3a3835;}
.supp-stripe{height:100%;}
.stripe-core{background:#fff;}
.stripe-injury{background:#f04a6a;}
.stripe-perf{background:#4ac4f0;}
.stripe-immune{background:#c04af0;}
.stripe-recov{background:#f09a4a;}
.supp-content{padding:20px 24px;}
.supp-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px;}
.supp-name{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;color:#fff;text-transform:uppercase;line-height:1.1;}
.supp-badge{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:0.15em;text-transform:uppercase;padding:3px 9px;white-space:nowrap;flex-shrink:0;}
.badge-core{background:rgba(255,255,255,0.1);color:#fff;}
.badge-injury{background:rgba(240,74,106,0.12);color:#f04a6a;}
.badge-perf{background:rgba(74,196,240,0.12);color:#4ac4f0;}
.badge-immune{background:rgba(192,74,240,0.12);color:#c04af0;}
.badge-recov{background:rgba(240,154,74,0.12);color:#f09a4a;}
.supp-body{font-size:14px;color:var(--mid);line-height:1.65;font-weight:300;}
.supp-body strong{color:#fff;font-weight:500;}
.supp-body a{color:#fff;}
.supp-insight{margin-top:10px;padding:10px 14px;border-left:2px solid #f09a4a;font-size:13px;color:#f09a4a;line-height:1.5;font-weight:300;}
.supp-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
.timing-pill{font-family:'Barlow Condensed',sans-serif;font-size:11px;letter-spacing:0.1em;font-weight:600;color:var(--text-muted);border:1px solid var(--border);padding:3px 10px;text-transform:uppercase;}
.disclaimer{margin-top:32px;padding:20px 24px;border:1px solid var(--border);background:var(--card-bg);font-size:12px;color:var(--text-muted);line-height:1.6;}
.restart-row{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;}
.restart-btn{background:#fff;border:none;padding:14px 28px;font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:0.15em;font-weight:700;color:#0a0a0a;cursor:pointer;text-transform:uppercase;transition:all 0.18s;}
.restart-btn:hover{background:#ddd;}
.secondary-btn{background:transparent;border:1px solid var(--border);padding:14px 28px;font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:0.15em;font-weight:700;color:var(--mid);cursor:pointer;text-transform:uppercase;transition:all 0.18s;}
.secondary-btn:hover{border-color:var(--mid);color:#fff;}
.footer{margin-top:60px;padding-top:24px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.footer-brand{font-family:'Barlow Condensed',sans-serif;font-size:12px;letter-spacing:0.15em;color:var(--text-muted);font-weight:600;text-transform:uppercase;}
.footer-link{font-size:12px;color:var(--text-muted);text-decoration:none;transition:color 0.15s;}
.footer-link:hover{color:#fff;}
.fade-out{animation:fadeOut 0.2s ease forwards;}
@keyframes fadeDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeOut{to{opacity:0;transform:translateY(-8px)}}
@media(max-width:520px){.question-card{padding:24px 20px}.results-hero{padding:24px 20px}.results-count-bar{padding:12px 20px}}
</style>
</head>

<script>
var answers = {};
var step = 0;
var hist = [];

// Steps: 0=gender, 1=age, 2=goal, 3=sport, 4=load, 5=diet, 6=sleep+demands, 7=immune
var TOTAL_STEPS = 8;

function getRecs(a) {
  var endurance = a.sport === 'endurance';
  var strength = a.sport === 'strength';
  var female = a.gender === 'female';
  var age = a.age || 30;
  var over40 = age >= 40;
  var hiload = a.load === 'high' || a.load === 'enthusiast';
  var protein = (a.diet === 'vegan' || a.diet === 'plant') ? 'plantprotein' : 'wpi';
  var fatigue = a.sleep === 'fatigue';
  var cogLoad = a.cogload === true;
  var sleepDep = a.sleepdep === true;
  var needsCogCreatine = cogLoad || sleepDep;
  var iron = (female && endurance) || (female && fatigue) || (endurance && fatigue);

  // Build priority 3
  var p = [];
  if (a.goal === 'injury') {
    p = ['collagen', 'omega3', 'magnesium'];
  } else if (a.goal === 'performance') {
    p = endurance ? [protein, 'creatine', 'omega3'] : [protein, 'creatine', 'magnesium'];
  } else {
    p = [protein, 'magnesium', 'omega3'];
  }

  // Over 40: collagen always in priority
  if (over40 && p.indexOf('collagen') === -1) { p[2] = 'collagen'; }

  // Iron bump
  if (iron && p.indexOf('irontesting') === -1 && !over40) { p[2] = 'irontesting'; }

  // Additional pool
  var pool = ['collagen','creatine',protein,'omega3','magnesium','immunec','bvitamin','irontesting'];
  var add = [];
  for (var i = 0; i < pool.length; i++) {
    var k = pool[i];
    if (p.indexOf(k) !== -1) continue;
    if (k === 'collagen' && a.goal !== 'injury' && !over40) continue;
    if (k === 'creatine' && a.goal !== 'injury' && !hiload && !endurance && !needsCogCreatine) continue;
    if (k === 'immunec' && a.immune === 'low' && !hiload) continue;
    if (k === 'bvitamin' && a.load === 'low') continue;
    if (k === 'irontesting' && !iron) continue;
    add.push(k);
    if (add.length >= 5) break;
  }

  return { priority: p, additional: add, over40: over40, needsCogCreatine: needsCogCreatine, cogLoad: cogLoad, sleepDep: sleepDep, iron: iron };
}

function suppCard(key, isPri, meta) {
  var defs = {
    collagen: {
      name: 'Collagen Repair Tendoforte',
      bl: 'Tendons and Joints', st: 'stripe-injury', ba: 'badge-injury',
      getBody: function(m) {
        var pre = '15g (3 scoops)';
        var post = '5g';
        return '<strong>' + pre + ' pre-exercise</strong> — take 30-60 min before training, ideally before runs. <strong>' + post + ' post-exercise</strong> daily for connective tissue recovery.' + (m.over40 ? '<div class="supp-insight">Collagen synthesis declines by up to 1% per year after 40 — this is why it is in your priority stack.</div>' : '');
      },
      timing: ['Pre-exercise', 'Post-exercise', 'Daily']
    },
    creatine: {
      name: 'Creatine Monohydrate',
      bl: 'Performance', st: 'stripe-perf', ba: 'badge-perf',
      getBody: function(m) {
        var dose = m.needsCogCreatine ? '10g' : '5g';
        var reason = m.needsCogCreatine ? (m.cogLoad && m.sleepDep ? 'high cognitive load and sleep deprivation' : m.cogLoad ? 'high cognitive load' : 'sleep deprivation') : 'muscle performance and recovery';
        var extra = m.needsCogCreatine ? ' At higher doses, creatine supports brain energy metabolism, improving focus, mental clarity and resilience under cognitive stress.' : '';
        return '<strong>' + dose + ' daily</strong>, best taken post-training — tailored for ' + reason + '.' + extra;
      },
      timing: ['Post-training']
    },
    wpi: {
      name: 'Grass-Fed Whey Protein Isolate',
      bl: 'Core Nutrition', st: 'stripe-core', ba: 'badge-core',
      getBody: function(m) { return 'Use to reach your daily protein target. Aim for minimum <strong>1.8g per kg body weight</strong> per day. Can increase to <strong>2.5g/kg</strong> if cutting weight.'; },
      timing: ['Post-training', 'Any time']
    },
    plantprotein: {
      name: 'Plant Protein Blend',
      bl: 'Core Nutrition', st: 'stripe-core', ba: 'badge-core',
      getBody: function(m) { return 'Aim for minimum <strong>1.8g per kg body weight</strong> per day. Choose a leucine-rich blend (pea and rice) to optimise muscle protein synthesis.'; },
      timing: ['Post-training', 'Any time']
    },
    omega3: {
      name: 'Ultra Omega-3',
      bl: 'Anti-inflammation', st: 'stripe-injury', ba: 'badge-injury',
      getBody: function(m) { return '<strong>5 capsules per day</strong>, spread across meals. Key for reducing inflammation, supporting joint health and accelerating recovery.'; },
      timing: ['With meals']
    },
    magnesium: {
      name: 'Triple Magnesium',
      bl: 'Sleep and Recovery', st: 'stripe-recov', ba: 'badge-recov',
      getBody: function(m) { return '<strong>1 scoop 30-60 min before bed</strong> as your maintenance dose. On high-intensity training days or sessions with high sweat rates, take a <strong>2nd scoop at a separate time</strong> during the day for better absorption.'; },
      timing: ['1 scoop before bed', '2nd scoop on HIIT days']
    },
    immunec: {
      name: 'Ultra Immune C',
      bl: 'Immune', st: 'stripe-immune', ba: 'badge-immune',
      getBody: function(m) { return 'Take in the <strong>morning only</strong> — avoid evenings as it can impact sleep. Cycle <strong>2 days on / 1 day off</strong>. Always prioritise during travel, high training blocks, or when feeling run down.'; },
      timing: ['Morning only', '2 on / 1 off']
    },
    bvitamin: {
      name: 'Ultra B Active B Complex',
      bl: 'Energy and Performance', st: 'stripe-perf', ba: 'badge-perf',
      getBody: function(m) { return 'Take <strong>first thing in the morning on an empty stomach</strong>. Omnivores eating animal proteins regularly can alternate days. Vegan athletes benefit from daily use.'; },
      timing: ['Morning, empty stomach']
    },
    irontesting: {
      name: 'Iron Testing — Know Your Levels',
      bl: 'Recommended Test', st: 'stripe-immune', ba: 'badge-immune',
      getBody: function(m) { return 'Iron deficiency is one of the most common and overlooked performance limiters — especially in females and endurance athletes. Excessive fatigue that persists despite adequate rest is a key warning sign.<br><br><strong>We recommend a full iron panel</strong> (serum ferritin, transferrin saturation, full blood count) to personalise your protocol.<br><br><a href="https://podcasts.apple.com/au/podcast/the-athletes-guide-to-iron-testing-deficiency/id1657287702?i=1000753173949" target="_blank" style="color:#fff;font-weight:500;">Listen: The Athletes Guide to Iron Testing</a>'; },
      timing: ['Blood test recommended', 'See your GP']
    }
  };

  var s = defs[key];
  if (!s) return '';
  var el = document.createElement('div');
  el.className = 'supp-card' + (isPri ? ' is-priority' : '');
  var stripe = document.createElement('div'); stripe.className = 'supp-stripe ' + s.st;
  var cont = document.createElement('div'); cont.className = 'supp-content';
  var top = document.createElement('div'); top.className = 'supp-top';
  var nm = document.createElement('div'); nm.className = 'supp-name'; nm.textContent = s.name;
  var bd = document.createElement('div'); bd.className = 'supp-badge ' + s.ba; bd.textContent = s.bl;
  top.appendChild(nm); top.appendChild(bd);
  var body = document.createElement('div'); body.className = 'supp-body'; body.innerHTML = s.getBody(meta);
  var pills = document.createElement('div'); pills.className = 'supp-pills';
  for (var j = 0; j < s.timing.length; j++) {
    var pill = document.createElement('span'); pill.className = 'timing-pill'; pill.textContent = s.timing[j];
    pills.appendChild(pill);
  }
  cont.appendChild(top); cont.appendChild(body); cont.appendChild(pills);
  el.appendChild(stripe); el.appendChild(cont);
  return el.outerHTML;
}

function progressHTML(stepNum, label) {
  var pct = Math.round((stepNum / TOTAL_STEPS) * 100);
  var d = document.createElement('div'); d.className = 'progress-wrap';
  var pm = document.createElement('div'); pm.className = 'progress-meta';
  var pl = document.createElement('span'); pl.className = 'progress-label'; pl.textContent = label || 'Progress';
  var pc = document.createElement('span'); pc.className = 'progress-count'; pc.textContent = (stepNum) + ' / ' + TOTAL_STEPS;
  pm.appendChild(pl); pm.appendChild(pc);
  var pt = document.createElement('div'); pt.className = 'progress-track';
  var pf = document.createElement('div'); pf.className = 'progress-fill'; pf.style.width = pct + '%';
  pt.appendChild(pf); d.appendChild(pm); d.appendChild(pt);
  return d;
}

function backBtn() {
  var nr = document.createElement('div'); nr.className = 'nav-row';
  var bb = document.createElement('button'); bb.className = 'back-btn'; bb.textContent = 'Back';
  bb.onclick = function() { goBack(); };
  nr.appendChild(bb); return nr;
}

function renderApp() {
  var app = document.getElementById('app');
  if (!app) return;
  var fns = [renderGender, renderAge, renderGoal, renderSport, renderLoad, renderDiet, renderSleepDemands, renderImmune];
  if (step < fns.length) { fns[step](app); } else { renderResults(app); }
}

function renderGender(app) {
  var d = document.createElement('div');
  d.appendChild(progressHTML(1));
  var qc = document.createElement('div'); qc.className = 'question-card';
  var qt = document.createElement('div'); qt.className = 'question-tag'; qt.textContent = 'About you';
  var qtext = document.createElement('div'); qtext.className = 'question-text'; qtext.textContent = 'What is your biological sex?';
  var opts = document.createElement('div'); opts.className = 'options';
  var items = [{l:'Male',v:'male'},{l:'Female',v:'female'}];
  var letters = ['A','B'];
  items.forEach(function(item, i) {
    var btn = document.createElement('button'); btn.className = 'option-btn';
    var lett = document.createElement('span'); lett.className = 'option-letter'; lett.textContent = letters[i];
    btn.appendChild(lett); btn.appendChild(document.createTextNode(item.l));
    btn.onclick = function() { selectSingle('gender', item.v); };
    opts.appendChild(btn);
  });
  qc.appendChild(qt); qc.appendChild(qtext); qc.appendChild(opts);
  d.appendChild(qc);
  app.innerHTML = ''; app.appendChild(d);
}

function renderAge(app) {
  var d = document.createElement('div');
  d.appendChild(progressHTML(2));
  var qc = document.createElement('div'); qc.className = 'question-card';
  var qt = document.createElement('div'); qt.className = 'question-tag'; qt.textContent = 'About you';
  var qtext = document.createElement('div'); qtext.className = 'question-text'; qtext.textContent = 'How old are you?';
  var currentAge = answers.age || 28;
  var ageDisp = document.createElement('div'); ageDisp.className = 'age-display';
  ageDisp.innerHTML = currentAge + '<span>yrs</span>';
  var ageNote = document.createElement('div'); ageNote.className = 'age-note';
  ageNote.textContent = '';
  var slider = document.createElement('input');
  slider.type = 'range'; slider.min = 16; slider.max = 80; slider.value = currentAge; slider.step = 1;
  slider.oninput = function() {
    var v = parseInt(this.value);
    ageDisp.innerHTML = v + '<span>yrs</span>';
    ageNote.className = 'age-note';
    ageNote.textContent = '';
    answers.age = v;
  };
  var nb = document.createElement('button'); nb.className = 'next-btn'; nb.textContent = 'Continue';
  nb.onclick = function() { if (!answers.age) { answers.age = currentAge; } advance(); };
  var aw = document.createElement('div'); aw.className = 'age-wrap';
  aw.appendChild(ageDisp); aw.appendChild(ageNote); aw.appendChild(slider);
  qc.appendChild(qt); qc.appendChild(qtext); qc.appendChild(aw); qc.appendChild(nb);
  d.appendChild(qc); d.appendChild(backBtn());
  app.innerHTML = ''; app.appendChild(d);
}

function renderGoal(app) {
  var d = document.createElement('div');
  d.appendChild(progressHTML(3));
  var qc = document.createElement('div'); qc.className = 'question-card';
  var qt = document.createElement('div'); qt.className = 'question-tag'; qt.textContent = 'Your goal';

function renderSleepDemands(app) {
  var d = document.createElement('div');
  d.appendChild(progressHTML(7));
  var qc = document.createElement('div'); qc.className = 'question-card';
  var qt = document.createElement('div'); qt.className = 'question-tag'; qt.textContent = 'Recovery and daily demands';
  var qtext = document.createElement('div'); qtext.className = 'question-text'; qtext.textContent = 'Select all that apply to you';
  var qsub = document.createElement('div'); qsub.className = 'question-sub'; qsub.textContent = 'You can select multiple options';

  var sleepItems = [
    {l:'Excessive fatigue — unusually tired despite rest', key:'sleep', val:'fatigue'},
    {l:'Poor sleep — struggling to recover between sessions', key:'sleep', val:'poor'},
    {l:'Average sleep — room for improvement', key:'sleep', val:'average'},
    {l:'Good sleep — recovering well', key:'sleep', val:'good'}
  ];
  var demandItems = [
    {l:'High cognitive load — demanding mental work daily', key:'cogload', val:true},
    {l:'Sleep deprivation — regularly under-slept', key:'sleepdep', val:true}
  ];

  // Track selections
  var sleepSel = answers.sleep || null;
  var cogSel = answers.cogload || false;
  var sleepDepSel = answers.sleepdep || false;

  var opts = document.createElement('div'); opts.className = 'options';

  // Sleep quality — single select group
  var sg = document.createElement('div'); sg.style.cssText = 'font-family:Barlow Condensed,sans-serif;font-size:10px;letter-spacing:0.15em;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;margin-top:4px;';
  sg.textContent = 'Sleep quality';
  opts.appendChild(sg);

  var sleepBtns = [];
  sleepItems.forEach(function(item) {
    var btn = document.createElement('button'); btn.className = 'option-btn' + (sleepSel === item.val ? ' selected' : '');
    btn.appendChild(document.createTextNode(item.l));
    btn.onclick = function() {
      sleepSel = item.val;
      sleepBtns.forEach(function(b) { b.className = 'option-btn'; });
      btn.className = 'option-btn selected';
      checkNext();
    };
    sleepBtns.push(btn);
    opts.appendChild(btn);
  });

  // Daily demands — multi select
  var dg = document.createElement('div'); dg.style.cssText = 'font-family:Barlow Condensed,sans-serif;font-size:10px;letter-spacing:0.15em;color:var(--text-muted);text-transform:uppercase;margin-bottom:8px;margin-top:20px;';
  dg.textContent = 'Daily demands (select any that apply)';
  opts.appendChild(dg);

  var cogBtn = document.createElement('button'); cogBtn.className = 'option-btn' + (cogSel ? ' selected' : '');
  cogBtn.appendChild(document.createTextNode('High cognitive load — demanding mental work daily'));
  cogBtn.onclick = function() { cogSel = !cogSel; cogBtn.className = 'option-btn' + (cogSel ? ' selected' : ''); checkNext(); };
  opts.appendChild(cogBtn);

  var sdBtn = document.createElement('button'); sdBtn.className = 'option-btn' + (sleepDepSel ? ' selected' : '');
  sdBtn.appendChild(document.createTextNode('Sleep deprivation — regularly under-slept'));
  sdBtn.onclick = function() { sleepDepSel = !sleepDepSel; sdBtn.className = 'option-btn' + (sleepDepSel ? ' selected' : ''); checkNext(); };
  opts.appendChild(sdBtn);

  var nb = document.createElement('button'); nb.className = 'next-btn'; nb.textContent = 'Continue'; nb.disabled = !sleepSel;
  nb.onclick = function() {
    answers.sleep = sleepSel;
    answers.cogload = cogSel;
    answers.sleepdep = sleepDepSel;
    advance();
  };

  function checkNext() { nb.disabled = !sleepSel; }

  qc.appendChild(qt); qc.appendChild(qtext); qc.appendChild(qsub); qc.appendChild(opts); qc.appendChild(nb);
  d.appendChild(qc); d.appendChild(backBtn());
  app.innerHTML = ''; app.appendChild(d);
}

function renderResults(app) {
  var r = getRecs(answers);

  var meta = { over40: r.over40, needsCogCreatine: r.needsCogCreatine, cogLoad: r.cogLoad, sleepDep: r.sleepDep };

  var d = document.createElement('div');
  d.appendChild(progressHTML(TOTAL_STEPS, 'Complete'));

  // Hero
  var hero = document.createElement('div'); hero.className = 'results-hero';
  var hl = document.createElement('div'); hl.className = 'results-hero-label'; hl.textContent = 'Your personalised protocol';
  var ht = document.createElement('div'); ht.className = 'results-hero-title'; ht.textContent = 'Supplement Protocol';
  var hm = document.createElement('div'); hm.className = 'results-hero-meta';
  var gl = answers.gender === 'female' ? 'Female' : 'Male';
  var GL = {injury:'Injury Recovery',performance:'Performance',general:'General Health',weight:'Weight Management'};
  var SL = {endurance:'Endurance',strength:'Strength and Power',team:'Team Sports',recreational:'General Fitness'};
  var LL = {high:'High Load',enthusiast:'Health Enthusiast',moderate:'Moderate Load',low:'Low Load'};
  var tags = [gl, answers.age + ' yrs', GL[answers.goal]||'', SL[answers.sport]||'', LL[answers.load]||''];
  tags.forEach(function(t) {
    if (t) { var mt = document.createElement('span'); mt.className = 'meta-tag'; mt.textContent = t; hm.appendChild(mt); }
  });
  hero.appendChild(hl); hero.appendChild(ht); hero.appendChild(hm); d.appendChild(hero);

  // Count bar
  var cb = document.createElement('div'); cb.className = 'results-count-bar';
  var cl = document.createElement('span'); cl.className = 'results-count-label'; cl.textContent = 'Priority stack';
  var cn = document.createElement('span'); cn.className = 'results-count-num'; cn.textContent = '3';
  cb.appendChild(cl); cb.appendChild(cn); d.appendChild(cb);

  // Priority
  var ps = document.createElement('div'); ps.className = 'priority-stack';
  var psl = document.createElement('div'); psl.className = 'section-label is-priority'; psl.textContent = 'Priority stack — start here';
  ps.appendChild(psl);
  p.forEach(function(key) { ps.innerHTML += suppCard(key, true, meta); });
  d.appendChild(ps);

  // Additional
  if (add.length > 0) {
    var as = document.createElement('div'); as.className = 'additional-stack';
    var asl = document.createElement('div'); asl.className = 'section-label'; asl.textContent = 'Exemplary additions';
    as.appendChild(asl);
    add.forEach(function(key) { as.innerHTML += suppCard(key, false, meta); });
    d.appendChild(as);
  }

  var disc = document.createElement('div'); disc.className = 'disclaimer';
  disc.textContent = 'This protocol is a starting-point guide based on your answers. Always consult a qualified health professional before starting any supplement regimen. Pillar Performance products are third-party tested and Informed Sport certified.';
  d.appendChild(disc);

  var rr = document.createElement('div'); rr.className = 'restart-row';
  var rb = document.createElement('button'); rb.className = 'restart-btn'; rb.textContent = 'Start over'; rb.onclick = function() { restart(); };
  var sb = document.createElement('button'); sb.className = 'secondary-btn'; sb.textContent = 'Shop Pillar'; sb.onclick = function() { window.open('https://pillarperformance.shop','_blank'); };
  rr.appendChild(rb); rr.appendChild(sb); d.appendChild(rr);

  app.innerHTML = ''; app.appendChild(d);
}

function selectSingle(key, val) {
  answers[key] = val;
  advance();
}

function advance() {
  hist.push({ step: step, answers: JSON.parse(JSON.stringify(answers)) });
  step++;
  var app = document.getElementById('app');
  app.classList.add('fade-out');
  setTimeout(function() { app.classList.remove('fade-out'); renderApp(); }, 180);
}

function goBack() {
  if (!hist.length) return;
  var prev = hist.pop(); step = prev.step; answers = prev.answers;
  var app = document.getElementById('app');
  app.classList.add('fade-out');
  setTimeout(function() { app.classList.remove('fade-out'); renderApp(); }, 180);
}

function restart() {
  answers = {}; step = 0; hist = [];
  var app = document.getElementById('app');
  app.classList.add('fade-out');
  setTimeout(function() { app.classList.remove('fade-out'); renderApp(); }, 180);
}

renderApp();
</script>
